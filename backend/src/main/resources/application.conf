ktor {
    application {
        modules = [ com.tekinflow.backend.ApplicationKt.module ]
    }
    deployment {
        port = 8080
        port = ${?KTOR_PORT}
        host = "127.0.0.1"
        host = ${?KTOR_HOST}
    }
}

database {
    url = "jdbc:postgresql://localhost:5432/satinalma"
    url = ${?DB_URL}
    user = "satinalma_app"
    user = ${?DB_USER}
    password = ${?DB_PASSWORD}
    maxPoolSize = 10
    maxPoolSize = ${?DB_MAX_POOL_SIZE}
}

jwt {
    secret = ${?JWT_SECRET}
    issuer = "TekinFlow-satinalma"
    audience = "satinalma-mobile"
    accessTokenExpiry = 900
    accessTokenExpiry = ${?JWT_ACCESS_TOKEN_EXPIRY}
    refreshTokenExpiry = 1209600
    refreshTokenExpiry = ${?JWT_REFRESH_TOKEN_EXPIRY}
}

security {
    allowedOrigins = []
}
